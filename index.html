  <div id="footerLeft"></div>
  <div id="footerRight"></div>
</footer>

<script>
  // Inject all SITE text into the page
  const setText = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  const setHTML = (id, val) => { const el = document.getElementById(id); if (el) el.innerHTML = val; };

  setText('logo', SITE.brandShort);
  setText('metaLeft', SITE.metaLeft);
  setText('metaRight', SITE.metaRight);

  // Marquee — repeats brand name 4 times
  const marqueeName = SITE.brandFull.replace('/', '<span class="slash">/</span>');
  document.getElementById('marqueeTrack').innerHTML =
    `<span>${marqueeName}</span><span>${marqueeName}</span><span>${marqueeName}</span><span>${marqueeName}</span>`;

  setText('tagline', SITE.tagline);
  setText('ctaPrimary', SITE.ctaPrimary);
  setText('ctaSecondary', SITE.ctaSecondary);

  setHTML('philosophyHeading', `${SITE.philosophyHeading} <em>${SITE.philosophyHeadingItalic}</em>`);
  setText('philosophyParagraph1', SITE.philosophyParagraph1);
  setText('philosophyParagraph2', SITE.philosophyParagraph2);
  setText('philosophyParagraph3', SITE.philosophyParagraph3);

  setHTML('servicesHeading', `${SITE.servicesHeading} <em>${SITE.servicesHeadingItalic}</em>`);

  for (let i = 1; i <= 4; i++) {
    setText(`service${i}Title`, SITE[`service${i}Title`]);
    setText(`service${i}Price`, SITE[`service${i}Price`]);
    setText(`service${i}Desc`, SITE[`service${i}Desc`]);
    const detailEl = document.getElementById(`service${i}Detail`);
    if (detailEl) {
      if (SITE[`service${i}Detail`]) {
        detailEl.textContent = SITE[`service${i}Detail`];
      } else {
        detailEl.style.display = 'none';
      }
    }
  }

  setHTML('processHeading', `${SITE.processHeading} <em>${SITE.processHeadingItalic}</em>`);
  setText('processIntro', SITE.processIntro);
  for (let i = 1; i <= 4; i++) {
    setText(`process${i}Number`, SITE[`process${i}Number`]);
    setText(`process${i}Title`, SITE[`process${i}Title`]);
    setText(`process${i}Body`, SITE[`process${i}Body`]);
  }

  setHTML('testimonialsHeading', `${SITE.testimonialsHeading} <em>${SITE.testimonialsHeadingItalic}</em>`);
  for (let i = 1; i <= 4; i++) {
    setText(`testimonial${i}Quote`, SITE[`testimonial${i}Quote`]);
    setText(`testimonial${i}Cite`, SITE[`testimonial${i}Cite`]);
  }

  setHTML('credsHeading', `${SITE.credsHeading} <em>${SITE.credsHeadingItalic}</em>`);
  setText('cred1Name', SITE.cred1Name);
  setText('cred1Status', SITE.cred1Status);
  setText('cred2Name', SITE.cred2Name);
  setText('cred2Status', SITE.cred2Status);
  setText('cred3Name', SITE.cred3Name);
  setText('cred3Status', SITE.cred3Status);

  setHTML('contactHeading', `${SITE.contactHeading} <em>${SITE.contactHeadingItalic}</em>`);
  const wa = document.getElementById('whatsappLink');
  wa.href = SITE.whatsappLink;
  wa.textContent = SITE.whatsappNumber;
  const ig = document.getElementById('instagramLink');
  ig.href = SITE.instagramLink;
  ig.textContent = SITE.instagramHandle;
  setText('locationText', SITE.locationText);

  setText('footerLeft', SITE.footerLeft);
  setText('footerRight', SITE.footerRight);

  // Scroll reveal
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>

</body>
</html>
