<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book Now — F/F | Brandon Zhao Yi</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="book">

<nav>
  <a href="index.html" class="logo" id="logo"></a>
  <ul class="nav-links">
    <li><a href="about.html" data-nav="about">About</a></li>
    <li><a href="book.html" data-nav="book">Book Now</a></li>
    <li><a href="testimonials.html" data-nav="testimonials">Testimonials</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<div class="page-hero">
  <div class="page-hero-label reveal-up">Book Now</div>
  <h1 class="reveal-up delay-1">Choose the structure that <em>fits your life.</em></h1>
</div>

<!-- Services overview — edit servicesOverview in data.js to fill this in -->
<div class="services-overview-section" id="servicesOverviewSection">
  <div class="section-label reveal-up">What I offer</div>
  <div class="services-overview-block reveal-up delay-1">
    <p id="servicesOverviewText"></p>
  </div>
</div>

<section id="services">
  <div class="section-label reveal-up">Packages</div>
  <h2 class="section-headline reveal-up delay-1" id="servicesHeading"></h2>
  <div class="services-grid">

    <div class="service-card reveal-up delay-1">
      <div class="service-card-image"><div class="image-placeholder">IMAGE<br/>Trial Session</div></div>
      <h3 id="service1Title"></h3>
      <div class="price" id="service1Price"></div>
      <p id="service1Desc"></p>
      <div class="pack-detail" id="service1Detail"></div>
    </div>

    <div class="service-card reveal-up delay-2">
      <div class="service-card-image"><div class="image-placeholder">IMAGE<br/>5-Session Pack</div></div>
      <h3 id="service2Title"></h3>
      <div class="price" id="service2Price"></div>
      <p id="service2Desc"></p>
      <div class="pack-detail" id="service2Detail"></div>
    </div>

    <div class="service-card reveal-up delay-3">
      <div class="service-card-image"><div class="image-placeholder">IMAGE<br/>10-Session Pack</div></div>
      <h3 id="service3Title"></h3>
      <div class="price" id="service3Price"></div>
      <p id="service3Desc"></p>
      <div class="pack-detail" id="service3Detail"></div>
    </div>

    <div class="service-card reveal-up delay-4">
      <div class="service-card-image"><div class="image-placeholder">IMAGE<br/>Online Coaching</div></div>
      <h3 id="service4Title"></h3>
      <div class="price" id="service4Price"></div>
      <p id="service4Desc"></p>
      <div class="pack-detail" id="service4Detail"></div>
    </div>

  </div>
</section>

<section id="contact" class="contact">
  <div class="section-label reveal-up">Begin</div>
  <h2 class="reveal-up delay-1" id="contactHeading"></h2>
  <div class="contact-methods">
    <div class="contact-method reveal-up delay-2">
      <div class="label">WhatsApp</div>
      <a id="whatsappLink"></a>
    </div>
    <div class="contact-method reveal-up delay-3">
      <div class="label">Instagram</div>
      <a id="instagramLink" target="_blank"></a>
    </div>
    <div class="contact-method reveal-up delay-4">
      <div class="label">Location</div>
      <a id="locationText"></a>
    </div>
  </div>
</section>

<footer>
  <div id="footerLeft"></div>
  <div id="footerRight"></div>
</footer>

<script src="data.js"></script>
<script src="site.js"></script>
<script>
  initCommon();

  // Services overview — show placeholder if empty
  var overviewEl = document.getElementById('servicesOverviewText');
  if (overviewEl) {
    if (SITE.servicesOverview) {
      overviewEl.textContent = SITE.servicesOverview;
    } else {
      overviewEl.innerHTML = '<span class="services-overview-placeholder">Add a description of what you offer across the board — edit the servicesOverview field in data.js.</span>';
    }
  }

  setHTML('servicesHeading', SITE.servicesHeading + ' <em>' + SITE.servicesHeadingItalic + '</em>');

  // Inject service cards with detail as bullet list
  for (var i = 1; i <= 4; i++) {
    setText('service' + i + 'Title', SITE['service' + i + 'Title']);
    setText('service' + i + 'Price', SITE['service' + i + 'Price']);
    setText('service' + i + 'Desc', SITE['service' + i + 'Desc']);

    var detail = SITE['service' + i + 'Detail'];
    var detailEl = document.getElementById('service' + i + 'Detail');
    if (detailEl) {
      if (detail) {
        var items = detail.split(' / ');
        detailEl.innerHTML = '<ul class="pack-detail-list">' +
          items.map(function(item) { return '<li>' + item + '</li>'; }).join('') +
          '</ul>';
      } else {
        detailEl.style.display = 'none';
      }
    }
  }

  initReveal();
</script>

</body>
</html>
