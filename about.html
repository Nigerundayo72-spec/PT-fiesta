<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About — F/F | Brandon Zhao Yi</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="about">

<nav>
  <a href="index.html" class="logo" id="logo"></a>
  <ul class="nav-links">
    <li><a href="about.html" data-nav="about">About</a></li>
    <li><a href="book.html" data-nav="book">Book Now</a></li>
    <li><a href="testimonials.html" data-nav="testimonials">Testimonials</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<div class="page-hero">
  <div class="page-hero-label reveal-up">About</div>
  <h1 class="reveal-up delay-1">The work behind the work.</h1>
</div>

<!-- Personal intro — shown when aboutIntro is filled in data.js -->
<section id="aboutIntroSection" class="about-intro-section">
  <div class="section-label reveal-up">About me</div>
  <p class="about-intro-text reveal-up delay-1" id="aboutIntroText"></p>
</section>

<!-- Hobbies — shown when hobbies is filled in data.js -->
<section id="hobbiesSection" class="hobbies-section">
  <div class="section-label reveal-up">Beyond the gym</div>
  <p class="hobbies-text reveal-up delay-1" id="hobbiesText"></p>
</section>

<!-- Articles — shown when any article is filled in data.js -->
<section id="articlesSection" class="articles-section">
  <div class="section-label reveal-up">Writing</div>
  <h2 class="section-headline reveal-up delay-1" id="articlesHeading"></h2>

  <!-- 3 featured articles with alternating image/text layout -->
  <div id="articlesFeatured"></div>

  <!-- Scrollable archive of older articles -->
  <div id="articlesArchiveWrapper">
    <div class="section-label reveal-up">More</div>
    <div class="articles-archive" id="articlesArchive"></div>
  </div>

  <!-- Link to full Substack -->
  <div class="articles-substack reveal-up" id="articlesSubstack"></div>
</section>

<section id="process" class="process-section" style="max-width:none;">
  <div class="process-inner">
    <div class="section-label reveal-up">Process</div>
    <h2 class="section-headline reveal-up delay-1" id="processHeading"></h2>
    <p class="process-intro reveal-up delay-2" id="processIntro"></p>
    <div class="process-grid">

      <div class="process-step reveal-up delay-1">
        <div class="process-step-inner">
          <div class="process-step-content">
            <div class="number" id="process1Number"></div>
            <h3 id="process1Title"></h3>
            <p id="process1Body"></p>
          </div>
          <div class="step-image">
            <div class="image-placeholder">IMAGE<br/>Movement Assessment<br/>Action shot</div>
          </div>
        </div>
      </div>

      <div class="process-step reveal-up delay-2">
        <div class="process-step-inner">
          <div class="process-step-content">
            <div class="number" id="process2Number"></div>
            <h3 id="process2Title"></h3>
            <p id="process2Body"></p>
          </div>
          <div class="step-image">
            <div class="image-placeholder">IMAGE<br/>Pain Management<br/>Corrective work</div>
          </div>
        </div>
      </div>

      <div class="process-step reveal-up delay-3">
        <div class="process-step-inner">
          <div class="process-step-content">
            <div class="number" id="process3Number"></div>
            <h3 id="process3Title"></h3>
            <p id="process3Body"></p>
          </div>
          <div class="step-image">
            <div class="image-placeholder">IMAGE<br/>Movement Quality<br/>Form coaching</div>
          </div>
        </div>
      </div>

      <div class="process-step reveal-up delay-4">
        <div class="process-step-inner">
          <div class="process-step-content">
            <div class="number" id="process4Number"></div>
            <h3 id="process4Title"></h3>
            <p id="process4Body"></p>
          </div>
          <div class="step-image">
            <div class="image-placeholder">IMAGE<br/>Performance<br/>Training hard</div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<section id="contact" class="contact">
  <div class="section-label reveal-up">Begin</div>
  <h2 class="reveal-up delay-1" id="contactHeading"></h2>
  <div class="contact-methods" id="contactMethods"></div>
</section>

<footer>
  <div id="footerLeft"></div>
  <div id="footerRight"></div>
</footer>

<script src="data.js"></script>
<script src="site.js"></script>
<script>
  initCommon();
  initAboutPage();
  initReveal();
</script>

</body>
</html>
