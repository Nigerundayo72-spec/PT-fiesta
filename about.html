<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About — F/F | Brandon Zhao Yi</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="about">

<nav>
  <a href="index.html" class="logo" id="logo"></a>
  <ul class="nav-links">
    <li><a href="about.html" data-nav="about">About</a></li>
    <li><a href="book.html" data-nav="book">Book Now</a></li>
    <li><a href="testimonials.html" data-nav="testimonials">Testimonials</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<div class="page-hero">
  <div class="page-hero-label reveal-up">About</div>
  <h1 class="reveal-up delay-1">The work <em>behind the work.</em></h1>
</div>

<section id="process" class="process-section" style="max-width:none;">
  <div class="process-inner">
    <div class="section-label reveal-up">Process</div>
    <h2 class="section-headline reveal-up delay-1" id="processHeading"></h2>
    <p class="process-intro reveal-up delay-2" id="processIntro"></p>
    <div class="process-grid">

      <div class="process-step reveal-up delay-1">
        <div class="process-step-inner">
          <div class="process-step-content">
            <div class="number" id="process1Number"></div>
            <h3 id="process1Title"></h3>
            <p id="process1Body"></p>
          </div>
          <div class="step-image">
            <div class="image-placeholder">IMAGE<br/>Movement Assessment<br/>Action shot</div>
          </div>
        </div>
      </div>

      <div class="process-step reveal-up delay-2">
        <div class="process-step-inner">
          <div class="process-step-content">
            <div class="number" id="process2Number"></div>
            <h3 id="process2Title"></h3>
            <p id="process2Body"></p>
          </div>
          <div class="step-image">
            <div class="image-placeholder">IMAGE<br/>Pain Management<br/>Corrective work</div>
          </div>
        </div>
      </div>

      <div class="process-step reveal-up delay-3">
        <div class="process-step-inner">
          <div class="process-step-content">
            <div class="number" id="process3Number"></div>
            <h3 id="process3Title"></h3>
            <p id="process3Body"></p>
          </div>
          <div class="step-image">
            <div class="image-placeholder">IMAGE<br/>Movement Quality<br/>Form coaching</div>
          </div>
        </div>
      </div>

      <div class="process-step reveal-up delay-4">
        <div class="process-step-inner">
          <div class="process-step-content">
            <div class="number" id="process4Number"></div>
            <h3 id="process4Title"></h3>
            <p id="process4Body"></p>
          </div>
          <div class="step-image">
            <div class="image-placeholder">IMAGE<br/>Performance<br/>Training hard</div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<section id="contact" class="contact">
  <div class="section-label reveal-up">Begin</div>
  <h2 class="reveal-up delay-1" id="contactHeading"></h2>
  <div class="contact-methods">
    <div class="contact-method reveal-up delay-2">
      <div class="label">WhatsApp</div>
      <a id="whatsappLink"></a>
    </div>
    <div class="contact-method reveal-up delay-3">
      <div class="label">Instagram</div>
      <a id="instagramLink" target="_blank"></a>
    </div>
    <div class="contact-method reveal-up delay-4">
      <div class="label">Location</div>
      <a id="locationText"></a>
    </div>
  </div>
</section>

<footer>
  <div id="footerLeft"></div>
  <div id="footerRight"></div>
</footer>

<script src="data.js"></script>
<script src="site.js"></script>
<script>
  initCommon();

  setHTML('processHeading', SITE.processHeading + ' <em>' + SITE.processHeadingItalic + '</em>');
  setText('processIntro', SITE.processIntro);

  // Inject process steps — bold the first sentence for scannability
  for (var i = 1; i <= 4; i++) {
    setText('process' + i + 'Number', SITE['process' + i + 'Number']);
    setText('process' + i + 'Title', SITE['process' + i + 'Title']);

    var body = SITE['process' + i + 'Body'];
    var el = document.getElementById('process' + i + 'Body');
    if (el) {
      var dot = body.indexOf('. ');
      if (dot > 0) {
        el.innerHTML = '<strong>' + body.substring(0, dot + 1) + '</strong> ' + body.substring(dot + 2);
      } else {
        el.textContent = body;
      }
    }
  }

  initReveal();
</script>

</body>
</html>
